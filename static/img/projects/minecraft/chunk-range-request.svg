<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">카메라 위치에 따른 청크 요청과 우선순위</title>
  <desc id="desc">카메라의 XZ 위치로 중심 청크를 구하고 원형 범위의 청크 후보를 거리순으로 정렬합니다. 가장 가까운 청크 하나부터 생성합니다. 격자는 거리순 선택을 설명하는 예시입니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26778c"/></marker>
    <pattern id="grid" x="75" y="170" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" stroke="#dce4e8" stroke-width="1" fill="none"/></pattern>
    <style>
      text{font-family:'Malgun Gothic',sans-serif;fill:#25313b;font-size:20px}
      .heading{font-size:24px;font-weight:700}
      .label{font-size:21px;font-weight:700}
      .small{font-size:17px;fill:#52616b}
      .arrow{stroke:#26778c;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .guide{stroke:#acbbc2;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1100" height="590" fill="#ffffff"/>
  <text x="40" y="49" class="heading">카메라 주변의 가까운 청크부터 요청</text>
  <text x="40" y="112" class="label">카메라의 X·Z 위치로 후보 범위 계산</text>
  <text x="40" y="143" class="small">거리순 선택 예시 · 격자 한 칸은 청크 하나</text>

  <rect x="75" y="170" width="420" height="360" fill="url(#grid)"/>
  <rect x="75" y="170" width="420" height="360" class="guide"/>
  <circle cx="285" cy="350" r="158" fill="#eef3f5" fill-opacity="0.45" stroke="#97a5ad" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="255" y="320" width="60" height="60" fill="#e3f0f3"/>
  <rect x="315" y="320" width="60" height="60" fill="#26778c" fill-opacity="0.14" stroke="#26778c" stroke-width="2"/>
  <rect x="255" y="440" width="60" height="60" fill="#eef3f5" stroke="#97a5ad" stroke-width="1.5"/>
  <rect x="135" y="260" width="60" height="60" fill="#eef3f5" stroke="#97a5ad" stroke-width="1.5"/>
  <path d="M285 350L285 470M285 350L165 290" class="guide" stroke-dasharray="4 4"/>
  <path d="M298 350H323" class="arrow"/>
  <circle cx="285" cy="350" r="9" fill="#26778c"/>
  <text x="285" y="406" text-anchor="middle" class="small">카메라 · 중심 청크</text>
  <text x="345" y="357" text-anchor="middle" class="label">1</text>
  <text x="285" y="477" text-anchor="middle" class="label">2</text>
  <text x="165" y="297" text-anchor="middle" class="label">3</text>
  <text x="465" y="559" class="small">X</text>
  <text x="48" y="190" class="small">Z</text>

  <rect x="600" y="185" width="450" height="84" rx="3" fill="#f2f5f7"/>
  <text x="825" y="219" text-anchor="middle" class="label">주변 후보 찾기</text>
  <text x="825" y="250" text-anchor="middle">원형 범위의 청크 후보 수집</text>
  <path d="M825 269V307" class="arrow"/>
  <rect x="600" y="324" width="450" height="84" rx="3" fill="#e3f0f3"/>
  <text x="825" y="358" text-anchor="middle" class="label">카메라와의 거리순으로 정렬</text>
  <text x="825" y="389" text-anchor="middle">가장 가까운 청크 하나 선택</text>
  <path d="M825 408V446" class="arrow"/>
  <rect x="600" y="463" width="450" height="84" rx="3" fill="#f2f5f7"/>
  <text x="825" y="497" text-anchor="middle" class="label">청크 생성·등록</text>
  <text x="825" y="528" text-anchor="middle">워커에 계산 작업 요청</text>

</svg>
